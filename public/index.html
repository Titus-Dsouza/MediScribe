<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediScribe</title>
  <!-- Inter font fallback – if unavailable the system sans‑serif will be used -->
  <style>
    @font-face {
      font-family: 'Inter';
      src: local('Inter');
    }
  </style>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Import map for bare module specifiers (jspdf) -->
  <script type="importmap">
  {
    "imports": {
      "jspdf": "https://esm.sh/jspdf@2.5.2"
    }
  }
  </script>
</head>

<body>
  <!-- Site header – top-left logo/brand -->
  <header class="site-header">
    <span class="site-header__symbol" aria-hidden="true">&#x2695;&#xFE0F;</span>
    <span class="site-header__name">MediScribe</span>
  </header>

  <div id="app" class="app-container"></div>

  <!-- Copyright footer – visible only on the landing page -->
  <footer class="site-footer">
    &copy; 2026 MediScribe. All rights reserved.
  </footer>

  <!-- Load the app as an ES module -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
